version: '3.8'

services:
  db:
    image: postgres:15-alpine # Alpine is a much smaller, RAM-friendly version
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      - "5050:5050"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "80:80" # This lets you access the frontend just by typing the Pi's IP
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro # Mounts your pre-built files directly
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data: